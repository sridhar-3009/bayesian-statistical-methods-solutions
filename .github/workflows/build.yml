name: Build PDFs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every chapter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ch*/ch*.tex
          work_in_root_file_dir: true

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: solutions-pdfs
          path: ch*/ch*.pdf
